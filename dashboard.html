<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>דשבורד המשתמש | נינה</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f3f5fb; color: #1f2540; margin: 0; padding: 0; }
    .page-wrap { max-width: 980px; margin: 0 auto; padding: 24px 16px; }
    .card { background: #fff; border: 1px solid #e6e9f3; border-radius: 18px; padding: 20px; margin-bottom: 14px; box-shadow: 0 10px 18px rgba(18, 30, 90, .06); }
    .card h2 { margin: 0 0 8px; font-size: 1.15rem; }
    .card p { margin: 6px 0; color: #445; }
    .status-circle { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-left: 8px; position: relative; top: -1px; }
    .status-active { background: #2ea269; }
    .status-inactive { background: #eb5757; }
    .btn { border: none; border-radius: 10px; padding: 10px 14px; font-weight: 700; cursor: pointer; background: #5f69ff; color: white; transition: background .2s; }
    .btn:hover { background: #3e4fe5; }
    .logout { background: #ff5f5f; margin-top: 10px; }
    .logout:hover { background: #de4343; }
    .list { margin: 0; padding: 0; list-style: none; }
    .list li { border-bottom: 1px solid #eee; padding: 10px 0; display: flex; justify-content: space-between; align-items: center; }
    .empty { color: #777; font-size: 0.92rem; }
    .spinner { animation: spin 1.1s linear infinite; border: 3px solid #e8ebf7; border-top-color: #5f69ff; border-radius: 50%; width: 18px; height: 18px; display: inline-block; margin-left: 6px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    a { color: #5f69ff; text-decoration: none; }
  </style>
</head>
<body>
  <div class="page-wrap">
    <h1>אזור אישי</h1>
    <div class="card" id="user-card">
      <h2>שלום <span id="user-name">...</span></h2>
      <p>אימייל: <strong id="user-email">...</strong></p>
      <p>סטטוס מנוי: <strong id="sub-status">בטעינה <span class="spinner"></span></strong></p>
      <button class="btn logout" id="logout-btn">התנתק</button>
    </div>

    <div class="card" id="usage-card">
      <h2>דשבורד לילות</h2>
      <p class="empty" id="nights-empty">טוען נתונים...</p>
      <ul class="list" id="nights-list"></ul>
    </div>

    <div class="card">
      <h2>דווח לילה חדש</h2>
      <div style="display:grid;gap:10px;">
        <input type="datetime-local" id="sleep-date" style="padding:10px;border:1px solid #dce2f4;border-radius:10px;" />
        <input type="number" id="sleep-duration" placeholder="משך שינה בדקות" style="padding:10px;border:1px solid #dce2f4;border-radius:10px;" />
        <textarea id="sleep-notes" rows="2" placeholder="הערות (אופציונלי)" style="padding:10px;border:1px solid #dce2f4;border-radius:10px;"></textarea>
        <button class="btn" id="save-sleep" style="margin-top:0;">שמור דיווח לילה</button>
      </div>
      <p id="sleep-message" class="empty" style="margin-top:8px;"></p>
    </div>

    <div class="card">
      <h2>מה הלאה</h2>
      <p>עבור ל- <a href="/quiz.html">שאלון שינה</a> כדי לעדכן את הפרופיל והמדדים.</p>
      <p>לקבלת תמיכה, שלח/י הודעה בוואטסאפ למספר שירות הלקוחות.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://qvuewochgjttvpgtwsir.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Hhs1AdWwpxqf8EBTcOG3uA_PIkRFdZn';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function init() {
      const { data: { session }, error } = await sb.auth.getSession();
      if (error || !session?.user) {
        window.location.href = '/auth.html';
        return;
      }
      const user = session.user;
      document.getElementById('user-name').textContent = user.user_metadata?.full_name || user.email || 'משתמש';
      document.getElementById('user-email').textContent = user.email || '---';
      const subStatusEl = document.getElementById('sub-status');

      const nightsList = document.getElementById('nights-list');
      const nightsEmpty = document.getElementById('nights-empty');

      try {
        const resp = await fetch(`/api/dashboard?user_id=${encodeURIComponent(user.id)}`);
        const payload = await resp.json();
        if (!resp.ok || !payload.ok) {
          subStatusEl.innerHTML = '<span class="status-circle status-inactive"></span> שגיאה בטעינת דשבורד';
          nightsEmpty.textContent = 'תקלה בטעינת נתונים, נסה לרענן.';
          return;
        }

        const userData = payload.user || {};
        const sessions = payload.sessions || [];

        if (userData.is_premium) {
          subStatusEl.innerHTML = '<span class="status-circle status-active"></span> מנוי פעיל';
        } else {
          subStatusEl.innerHTML = '<span class="status-circle status-inactive"></span> לא יישום מנוי פעיל';
        }

        if (!sessions.length) {
          nightsEmpty.textContent = 'אין רשומות לילות זמינות. מלא/י את השאלון וצרף/י דיווח לילה ראשון.';
          return;
        }

        nightsEmpty.style.display = 'none';
        sessions.slice(0, 10).forEach(item => {
          const li = document.createElement('li');
          const date = new Date(item.date).toLocaleDateString('he-IL');
          li.innerHTML = `<span>${date}</span><strong>${item.duration_minutes || '-'} דק' ${item.notes ? `(${item.notes})` : ''}</strong>`;
          nightsList.appendChild(li);
        });
      } catch (e) {
        subStatusEl.innerHTML = '<span class="status-circle status-inactive"></span> שגיאה בטעינת דשבורד';
        nightsEmpty.textContent = 'תקלה בקריאת לילות (בדקו את הטבלאות).';
      }

      document.getElementById('save-sleep').addEventListener('click', async () => {
        const sleepDate = document.getElementById('sleep-date').value;
        const sleepDuration = parseInt(document.getElementById('sleep-duration').value, 10);
        const sleepNotes = document.getElementById('sleep-notes').value.trim();
        const msgEl = document.getElementById('sleep-message');

        if (!sleepDate || !sleepDuration) {
          msgEl.textContent = 'נא להזין תאריך ומשך שינה';
          return;
        }

        try {
          const r = await fetch('/api/sleep-session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId: user.id, date: sleepDate, duration_minutes: sleepDuration, notes: sleepNotes })
          });
          const result = await r.json();
          if (!r.ok || !result.ok) throw new Error(result.message || 'Error saving');
          msgEl.textContent = 'דיווח שמור בהצלחה';
          document.getElementById('sleep-date').value = '';
          document.getElementById('sleep-duration').value = '';
          document.getElementById('sleep-notes').value = '';
          window.location.reload();
        } catch (err) {
          msgEl.textContent = `שגיאה בשמירת דיווח: ${err.message}`;
        }
      });
    }

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = '/auth.html';
    });

    init();
  </script>

<!-- כלי נגישות -->
<style>
#a11y-widget{position:fixed;bottom:80px;left:20px;z-index:10000;font-family:'Heebo',Arial,sans-serif}
#a11y-toggle{width:48px;height:48px;border-radius:50%;background:#7c5cbf;color:white;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(124,92,191,.4);transition:transform .2s}
#a11y-toggle:hover{transform:scale(1.1)}
#a11y-panel{display:none;position:absolute;bottom:58px;left:0;background:white;border:1px solid #e8e0f7;border-radius:16px;padding:16px;width:190px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
#a11y-panel.open{display:block}
#a11y-panel-title{font-size:13px;font-weight:700;color:#7c5cbf;margin-bottom:10px;text-align:center}
.a11y-btn{display:block;width:100%;padding:7px 12px;margin-bottom:5px;background:#f5f2fd;border:1px solid #e8e0f7;border-radius:8px;color:#2d2540;font-family:'Heebo',Arial,sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:right;transition:background .15s}
.a11y-btn:hover{background:#e8e0f7}
.a11y-btn.a11y-active{background:#7c5cbf;color:white;border-color:#7c5cbf}
body.a11y-contrast{filter:contrast(160%)}
body.a11y-gray{filter:grayscale(100%)}
body.a11y-links a{text-decoration:underline!important;outline:2px solid #7c5cbf!important;outline-offset:2px}
body.a11y-font,body.a11y-font *{font-family:Arial,sans-serif!important}
</style>
<div id="a11y-widget">
  <button id="a11y-toggle" onclick="toggleA11y()" aria-label="אפשרויות נגישות" aria-expanded="false">♿</button>
  <div id="a11y-panel" role="dialog" aria-label="תפריט נגישות">
    <div id="a11y-panel-title">כלי נגישות</div>
    <button class="a11y-btn" onclick="a11yFont(1)">הגדל טקסט  א+</button>
    <button class="a11y-btn" onclick="a11yFont(-1)">הקטן טקסט  א-</button>
    <button class="a11y-btn" id="ab-contrast" onclick="a11yClass('a11y-contrast','ab-contrast')">ניגודיות גבוהה</button>
    <button class="a11y-btn" id="ab-gray"     onclick="a11yClass('a11y-gray','ab-gray')">גווני אפור</button>
    <button class="a11y-btn" id="ab-links"    onclick="a11yClass('a11y-links','ab-links')">הדגשת קישורים</button>
    <button class="a11y-btn" id="ab-font"     onclick="a11yClass('a11y-font','ab-font')">פונט קריא</button>
    <button class="a11y-btn" onclick="a11yReset()">↺ איפוס</button>
  </div>
</div>
<script>
(function(){
  var S=JSON.parse(localStorage.getItem('a11y')||'{}');
  if(S.fs)document.documentElement.style.fontSize=S.fs+'px';
  ['a11y-contrast','a11y-gray','a11y-links','a11y-font'].forEach(function(c){if(S[c])document.body.classList.add(c);});
  function sync(){
    [['a11y-contrast','ab-contrast'],['a11y-gray','ab-gray'],['a11y-links','ab-links'],['a11y-font','ab-font']].forEach(function(p){
      var b=document.getElementById(p[1]);if(b)b.classList.toggle('a11y-active',document.body.classList.contains(p[0]));
    });
  }
  window.toggleA11y=function(){
    var p=document.getElementById('a11y-panel');
    p.classList.toggle('open');
    document.getElementById('a11y-toggle').setAttribute('aria-expanded',p.classList.contains('open'));
    sync();
  };
  window.a11yFont=function(d){
    var S=JSON.parse(localStorage.getItem('a11y')||'{}');
    var c=S.fs||16;var n=Math.min(26,Math.max(12,c+d*2));
    document.documentElement.style.fontSize=n+'px';S.fs=n;
    localStorage.setItem('a11y',JSON.stringify(S));
  };
  window.a11yClass=function(cls,btnId){
    document.body.classList.toggle(cls);
    var S=JSON.parse(localStorage.getItem('a11y')||'{}');S[cls]=document.body.classList.contains(cls);
    localStorage.setItem('a11y',JSON.stringify(S));sync();
  };
  window.a11yReset=function(){
    ['a11y-contrast','a11y-gray','a11y-links','a11y-font'].forEach(function(c){document.body.classList.remove(c);});
    document.documentElement.style.fontSize='';localStorage.removeItem('a11y');sync();
  };
  sync();
})();
</script>

</body>
</html>
