<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לילה טוב – הרשמה</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      color: white;
      text-align: center;
    }

    .moon { font-size: 48px; margin-bottom: 12px; }

    h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 32px; }

    .tabs {
      display: flex;
      background: rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      padding: 8px;
      border: none;
      background: transparent;
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.2s;
    }

    .tab.active {
      background: rgba(255,255,255,0.15);
      color: white;
      font-weight: 600;
    }

    .form-group { margin-bottom: 16px; text-align: right; }

    label { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }

    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      color: white;
      font-size: 15px;
      outline: none;
      transition: border 0.2s;
    }

    input:focus { border-color: rgba(255,255,255,0.4); }
    input::placeholder { color: rgba(255,255,255,0.3); }

    .btn-primary {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.2s;
    }

    .btn-primary:hover { opacity: 0.9; }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: rgba(255,255,255,0.3);
      font-size: 13px;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      background: white;
      border: none;
      border-radius: 12px;
      color: #333;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.2s;
    }

    .btn-google:hover { opacity: 0.9; }

    .btn-google img { width: 20px; height: 20px; }

    .message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      display: none;
    }

    .message.success { background: rgba(72,199,142,0.2); color: #48c78e; }
    .message.error   { background: rgba(255,100,100,0.2); color: #ff6464; }

    .switch-text {
      margin-top: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }

    .switch-text a {
      color: #a78bfa;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="moon">🌙</div>
  <h1>לילה טוב</h1>
  <p class="subtitle">יועצת השינה החכמה שלך</p>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">כניסה</button>
    <button class="tab" onclick="switchTab('signup')">הרשמה</button>
  </div>

  <!-- Email/Password form -->
  <div id="email-form">
    <div class="form-group">
      <label>אימייל</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>
    <div class="form-group">
      <label>סיסמה</label>
      <input type="password" id="password" placeholder="לפחות 6 תווים" />
    </div>
    <button class="btn-primary" onclick="handleEmailAuth()">המשך</button>
  </div>

  <div class="divider">או</div>

  <button class="btn-google" onclick="handleGoogle()">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google" />
    המשך עם Google
  </button>

  <div class="message" id="message"></div>

  <div class="switch-text" id="switch-text">
    אין לך חשבון? <a onclick="switchTab('signup')">הרשמה</a>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://qvuewochgjttvpgtwsir.supabase.co';
  const SUPABASE_ANON_KEY = 'הכנס כאן את ה-ANON KEY שלך מ-Supabase';

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentTab = 'login';

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle('active', (tab === 'login' && i === 0) || (tab === 'signup' && i === 1));
    });
    const switchText = document.getElementById('switch-text');
    switchText.innerHTML = tab === 'login'
      ? 'אין לך חשבון? <a onclick="switchTab(\'signup\')">הרשמה</a>'
      : 'כבר יש לך חשבון? <a onclick="switchTab(\'login\')">כניסה</a>';
    showMessage('', '');
  }

  function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message ' + type;
    el.style.display = text ? 'block' : 'none';
  }

  async function handleEmailAuth() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) return showMessage('נא למלא אימייל וסיסמה', 'error');

    if (currentTab === 'signup') {
      const { error } = await sb.auth.signUp({ email, password });
      if (error) return showMessage(error.message, 'error');
      showMessage('נשלח אליך מייל אימות — בדוק את תיבת הדואר שלך 📬', 'success');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) return showMessage('אימייל או סיסמה שגויים', 'error');
      window.location.href = '/quiz.html';
    }
  }

  async function handleGoogle() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/quiz.html' }
    });
    if (error) showMessage(error.message, 'error');
  }

  // אם המשתמש כבר מחובר — שלח אותו לדף הראשי
  sb.auth.getSession().then(({ data }) => {
    if (data.session) window.location.href = '/quiz.html';
  });
</script>
</body>
</html>
