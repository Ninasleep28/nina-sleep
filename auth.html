<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon.svg">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>נינה – הרשמה</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Heebo', 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 420px;
      color: white;
      text-align: center;
    }
    .moon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    p.subtitle { font-size: 14px; color: rgba(255,255,255,0.6); margin-bottom: 32px; }
    .form-group { margin-bottom: 16px; text-align: right; }
    label { display: block; font-size: 13px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px; color: white; font-size: 15px; outline: none; transition: border 0.2s;
    }
    input:focus { border-color: rgba(255,255,255,0.4); }
    input::placeholder { color: rgba(255,255,255,0.3); }
    .btn-primary {
      width: 100%; padding: 13px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none; border-radius: 12px; color: white;
      font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 4px; transition: opacity 0.2s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.4; cursor: default; }
    .message {
      margin-top: 16px; padding: 12px; border-radius: 10px; font-size: 14px; display: none;
    }
    .message.success { background: rgba(72,199,142,0.2); color: #48c78e; }
    .message.error { background: rgba(255,100,100,0.2); color: #ff6464; }
    .marketing-consent { margin-top: 12px; display: flex; align-items: flex-start; gap: 10px; text-align: right; }
    .marketing-consent input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; margin-top: 3px; accent-color: #7c5cbf; cursor: pointer; }
    .marketing-consent label { font-size: 12px; color: rgba(255,255,255,0.6); line-height: 1.5; cursor: pointer; }
    .phone-hint { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; text-align: right; }
  </style>
</head>
<body>
<div class="card">
  <div class="moon">🌙</div>
  <h1>נינה</h1>
  <p class="subtitle">יועצת השינה החכמה שלך</p>
  <div id="signup-form">
    <div class="form-group">
      <label>שם מלא</label>
      <input type="text" id="fullname" placeholder="ישראל ישראלי" />
    </div>
    <div class="form-group">
      <label>אימייל</label>
      <input type="email" id="email" placeholder="your@email.com" />
    </div>
    <div class="form-group">
      <label>מספר וואטספ</label>
      <input type="tel" id="whatsapp" placeholder="05X-XXXXXXX" dir="ltr" />
      <div class="phone-hint">המספר שבו תקבלו הודעות מנינה</div>
    </div>
    <div class="marketing-consent">
      <input type="checkbox" id="marketing-consent" />
      <label for="marketing-consent">אני מסכים/ה לקבל הודעות וואטספ מנינה לצורך ייעוץ שינה</label>
    </div>
    <button class="btn-primary" id="submit-btn" onclick="handleSignup()">המשך ←</button>
  </div>
  <div id="verify-form" style="display:none;">
    <p style="font-size:14px;color:rgba(255,255,255,0.7);margin-bottom:20px;">שלחנו קוד אימות בן 6 ספרות לכתובת המייל שהזנתם</p>
    <div class="form-group" style="text-align:center;">
      <label>קוד אימות</label>
      <input type="text" id="verify-code" placeholder="000000" dir="ltr" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:8px;" />
    </div>
    <button class="btn-primary" id="verify-btn" onclick="handleVerify()">אימות והמשך לשאלון ←</button>
    <button class="btn-resend" onclick="resendCode()" style="background:none;border:none;color:rgba(255,255,255,0.5);font-size:13px;cursor:pointer;margin-top:12px;font-family:'Heebo',sans-serif;">לא קיבלתם? שלחו שוב</button>
  </div>
  <div class="message" id="message"></div>
</div>

<script>
  function showMessage(text, type) {
    const el = document.getElementById('message');
    el.textContent = text;
    el.className = 'message ' + type;
    el.style.display = text ? 'block' : 'none';
  }

  function formatWhatsApp(num) {
    let d = num.replace(/[\s\-\(\)]/g, '');
    if (d.startsWith('05')) d = '972' + d.slice(1);
    if (d.startsWith('+')) d = d.slice(1);
    return 'whatsapp:+' + d;
  }

  let pendingEmail = '';

  async function handleSignup() {
    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const whatsapp = document.getElementById('whatsapp').value.trim();

    if (!fullname) return showMessage('נא למלא שם מלא', 'error');
    if (!email) return showMessage('נא למלא אימייל', 'error');
    if (!whatsapp) return showMessage('נא למלא מספר וואטספ', 'error');
    if (!document.getElementById('marketing-consent').checked) return showMessage('נא לאשר קבלת הודעות וואטספ כדי להמשיך', 'error');

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.textContent = 'שולח קוד אימות...';

    try {
      const res = await fetch('/send-verification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (!res.ok) throw new Error('Failed to send');

      pendingEmail = email;
      localStorage.setItem('nina_fullname', fullname);
      localStorage.setItem('nina_whatsapp', formatWhatsApp(whatsapp));
      localStorage.setItem('nina_email', email);

      document.getElementById('signup-form').style.display = 'none';
      document.getElementById('verify-form').style.display = 'block';
      showMessage('', '');
    } catch (err) {
      showMessage('שגיאה בשליחת קוד, נסו שוב', 'error');
      btn.disabled = false;
      btn.textContent = 'המשך ←';
    }
  }

  async function handleVerify() {
    const code = document.getElementById('verify-code').value.trim();
    if (!code || code.length !== 6) return showMessage('נא להזין קוד בן 6 ספרות', 'error');

    const btn = document.getElementById('verify-btn');
    btn.disabled = true;
    btn.textContent = 'מאמת...';

    try {
      const res = await fetch('/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail, code })
      });
      const data = await res.json();
      if (!res.ok) {
        showMessage(data.message || 'קוד שגוי', 'error');
        btn.disabled = false;
        btn.textContent = 'אימות והמשך לשאלון ←';
        return;
      }

      // Verified — save user and redirect
      await fetch('/save-user', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fullname: localStorage.getItem('nina_fullname'),
          email: pendingEmail,
          whatsappNumber: localStorage.getItem('nina_whatsapp')
        })
      });

      window.location.href = '/quiz.html';
    } catch (err) {
      showMessage('שגיאה באימות, נסו שוב', 'error');
      btn.disabled = false;
      btn.textContent = 'אימות והמשך לשאלון ←';
    }
  }

  async function resendCode() {
    showMessage('שולח קוד חדש...', 'success');
    try {
      const res = await fetch('/send-verification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: pendingEmail })
      });
      if (!res.ok) throw new Error();
      showMessage('קוד חדש נשלח למייל', 'success');
    } catch {
      showMessage('שגיאה בשליחה, נסו שוב', 'error');
    }
  }
</script>

<!-- כלי נגישות -->
<style>
#a11y-widget{position:fixed;bottom:80px;left:20px;z-index:10000;font-family:'Heebo',Arial,sans-serif}
#a11y-toggle{width:48px;height:48px;border-radius:50%;background:#7c5cbf;color:white;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(124,92,191,.4);transition:transform .2s}
#a11y-toggle:hover{transform:scale(1.1)}
#a11y-panel{display:none;position:absolute;bottom:58px;left:0;background:white;border:1px solid #e8e0f7;border-radius:16px;padding:16px;width:190px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
#a11y-panel.open{display:block}
#a11y-panel-title{font-size:13px;font-weight:700;color:#7c5cbf;margin-bottom:10px;text-align:center}
.a11y-btn{display:block;width:100%;padding:7px 12px;margin-bottom:5px;background:#f5f2fd;border:1px solid #e8e0f7;border-radius:8px;color:#2d2540;font-family:'Heebo',Arial,sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:right;transition:background .15s}
.a11y-btn:hover{background:#e8e0f7}
.a11y-btn.a11y-active{background:#7c5cbf;color:white;border-color:#7c5cbf}
body.a11y-contrast{filter:contrast(160%)}
body.a11y-gray{filter:grayscale(100%)}
body.a11y-links a{text-decoration:underline!important;outline:2px solid #7c5cbf!important;outline-offset:2px}
body.a11y-font,body.a11y-font *{font-family:Arial,sans-serif!important}
</style>
<div id="a11y-widget">
  <button id="a11y-toggle" onclick="toggleA11y()" aria-label="אפשרויות נגישות" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></button>
  <div id="a11y-panel" role="dialog" aria-label="תפריט נגישות">
    <div id="a11y-panel-title">כלי נגישות</div>
    <button class="a11y-btn" onclick="a11yFont(1)">הגדל טקסט  א+</button>
    <button class="a11y-btn" onclick="a11yFont(-1)">הקטן טקסט  א-</button>
    <button class="a11y-btn" id="ab-contrast" onclick="a11yClass('a11y-contrast','ab-contrast')">ניגודיות גבוהה</button>
    <button class="a11y-btn" id="ab-gray"     onclick="a11yClass('a11y-gray','ab-gray')">גווני אפור</button>
    <button class="a11y-btn" id="ab-links"    onclick="a11yClass('a11y-links','ab-links')">הדגשת קישורים</button>
    <button class="a11y-btn" id="ab-font"     onclick="a11yClass('a11y-font','ab-font')">פונט קריא</button>
    <button class="a11y-btn" onclick="a11yReset()">↺ איפוס</button>
  </div>
</div>
<script>
(function(){
  var S=JSON.parse(localStorage.getItem('a11y')||'{}');
  if(S.fs)document.documentElement.style.fontSize=S.fs+'px';
  ['a11y-contrast','a11y-gray','a11y-links','a11y-font'].forEach(function(c){if(S[c])document.body.classList.add(c);});
  function sync(){
    [['a11y-contrast','ab-contrast'],['a11y-gray','ab-gray'],['a11y-links','ab-links'],['a11y-font','ab-font']].forEach(function(p){
      var b=document.getElementById(p[1]);if(b)b.classList.toggle('a11y-active',document.body.classList.contains(p[0]));
    });
  }
  window.toggleA11y=function(){
    var p=document.getElementById('a11y-panel');
    p.classList.toggle('open');
    document.getElementById('a11y-toggle').setAttribute('aria-expanded',p.classList.contains('open'));
    sync();
  };
  window.a11yFont=function(d){
    var S=JSON.parse(localStorage.getItem('a11y')||'{}');
    var c=S.fs||16;var n=Math.min(26,Math.max(12,c+d*2));
    document.documentElement.style.fontSize=n+'px';S.fs=n;
    localStorage.setItem('a11y',JSON.stringify(S));
  };
  window.a11yClass=function(cls,btnId){
    document.body.classList.toggle(cls);
    var S=JSON.parse(localStorage.getItem('a11y')||'{}');S[cls]=document.body.classList.contains(cls);
    localStorage.setItem('a11y',JSON.stringify(S));sync();
  };
  window.a11yReset=function(){
    ['a11y-contrast','a11y-gray','a11y-links','a11y-font'].forEach(function(c){document.body.classList.remove(c);});
    document.documentElement.style.fontSize='';localStorage.removeItem('a11y');sync();
  };
  sync();
})();
</script>

</body>
</html>
