<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>לילה טוב – התשלום בוצע בהצלחה</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 40px 36px;
      width: 100%;
      max-width: 480px;
      color: white;
      text-align: center;
    }
    .success-icon { font-size: 64px; margin-bottom: 20px; animation: bounce 0.6s ease-in-out; }
    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    h1 {
      font-size: 32px; font-weight: 700; margin-bottom: 12px;
      background: linear-gradient(135deg, #58c87b, #48c78e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .subtitle { font-size: 16px; color: rgba(255,255,255,0.7); margin-bottom: 32px; line-height: 1.6; }
    .info-box {
      background: rgba(88, 200, 123, 0.1); border: 1px solid rgba(88, 200, 123, 0.3);
      border-radius: 16px; padding: 20px; margin-bottom: 24px; text-align: right;
    }
    .info-item {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 12px; margin-bottom: 12px; font-size: 14px; color: rgba(255,255,255,0.8);
    }
    .info-item:last-child { margin-bottom: 0; }
    .info-icon {
      width: 24px; height: 24px; background: rgba(88, 200, 123, 0.3);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      color: #58c87b; font-size: 14px;
    }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn-whatsapp {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #25d366, #1dae5f);
      border: none; border-radius: 12px; color: white;
      font-size: 16px; font-weight: 600; cursor: pointer;
      transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-whatsapp:hover { opacity: 0.9; }
    .btn-home {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none; border-radius: 12px; color: white;
      font-size: 16px; font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .btn-home:hover { opacity: 0.9; }
    .message { margin-top: 20px; padding: 12px; border-radius: 10px; font-size: 13px; display: none; }
    .message.error { background: rgba(255,100,100,0.2); color: #ff6464; }
  </style>
</head>
<body>
<div class="card">
  <div class="success-icon">✅</div>
  <h1>תודה!</h1>
  <p class="subtitle">התשלום בוצע בהצלחה<br>אתה כעת חלק מ-לילה טוב פרימיום</p>
  <div class="info-box">
    <div class="info-item">
      <span>יוצרים קשר עם הצוות שלנו</span>
      <div class="info-icon">✓</div>
    </div>
    <div class="info-item">
      <span>מאומתת רישומך במערכת</span>
      <div class="info-icon">✓</div>
    </div>
    <div class="info-item">
      <span>מוכנה לשימוש מיידי בWhatsApp</span>
      <div class="info-icon">✓</div>
    </div>
  </div>
  <div class="btn-group">
    <button class="btn-whatsapp" onclick="openWhatsApp()">
      💬 פתח את WhatsApp של נינה
    </button>
    <button class="btn-home" onclick="goHome()">
      <span id="btn-text">עבור לדף הבית</span>
    </button>
  </div>
  <div class="message" id="message"></div>
</div>

<script>
  const SUPABASE_URL = 'https://qvuewochgjttvpgtwsir.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Hhs1AdWwpxqf8EBTcOG3uA_PIkRFdZn';
  const NINA_WHATSAPP_NUMBER = '14152538886'; // Twilio Sandbox number

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Funnel Tracking
  async function trackPage() {
    try {
      let sessionId = localStorage.getItem('nina_session');
      if (!sessionId) { sessionId = crypto.randomUUID(); localStorage.setItem('nina_session', sessionId); }
      const { data: { session } } = await sb.auth.getSession();
      await sb.from('funnel_events').insert({ session_id: sessionId, page: 'success', user_id: session?.user?.id || null });
    } catch (e) {}
  }
  trackPage();

  function openWhatsApp() {
    const message = encodeURIComponent('שלום נינה! השתלמתי לתוכנית פרימיום. אני מוכן להתחיל.');
    const whatsappUrl = `https://wa.me/${NINA_WHATSAPP_NUMBER}?text=${message}`;
    window.open(whatsappUrl, '_blank');
  }

  async function goHome() {
    window.location.href = '/';
  }

  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  if (sessionId) console.log('✅ Checkout session ID:', sessionId);
</script>

<!-- כלי <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><line x1="12" y1="7.5" x2="12" y2="16"/><line x1="7" y1="11" x2="17" y2="11"/><line x1="12" y1="16" x2="8.5" y2="21"/><line x1="12" y1="16" x2="15.5" y2="21"/></svg>ישות -->
<style>
#a11y-widget{position:fixed;bottom:80px;left:20px;z-index:10000;font-family:'Heebo',Arial,sans-serif}
#a11y-toggle{width:48px;height:48px;border-radius:50%;background:#7c5cbf;color:white;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(124,92,191,.4);transition:transform .2s}
#a11y-toggle:hover{transform:scale(1.1)}
#a11y-panel{display:none;position:absolute;bottom:58px;left:0;background:white;border:1px solid #e8e0f7;border-radius:16px;padding:16px;width:190px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
#a11y-panel.open{display:block}
#a11y-panel-title{font-size:13px;font-weight:700;color:#7c5cbf;margin-bottom:10px;text-align:center}
.a11y-btn{display:block;width:100%;padding:7px 12px;margin-bottom:5px;background:#f5f2fd;border:1px solid #e8e0f7;border-radius:8px;color:#2d2540;font-family:'Heebo',Arial,sans-serif;font-size:13px;font-weight:600;cursor:pointer;text-align:right;transition:background .15s}
.a11y-btn:hover{background:#e8e0f7}
.a11y-btn.a11y-active{background:#7c5cbf;color:white;border-color:#7c5cbf}
body.a11y-contrast{filter:contrast(160%)}
body.a11y-gray{filter:grayscale(100%)}
body.a11y-links a{text-decoration:underline!important;outline:2px solid #7c5cbf!important;outline-offset:2px}
body.a11y-font,body.a11y-font *{font-family:Arial,sans-serif!important}
</style>
<div id="a11y-widget">
  <button id="a11y-toggle" onclick="toggleA11y()" aria-label="אפשרויות <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><line x1="12" y1="7.5" x2="12" y2="16"/><line x1="7" y1="11" x2="17" y2="11"/><line x1="12" y1="16" x2="8.5" y2="21"/><line x1="12" y1="16" x2="15.5" y2="21"/></svg>ישות" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><line x1="12" y1="7.5" x2="12" y2="16"/><line x1="7" y1="11" x2="17" y2="11"/><line x1="12" y1="16" x2="8.5" y2="21"/><line x1="12" y1="16" x2="15.5" y2="21"/></svg></button>
  <div id="a11y-panel" role="dialog" aria-label="תפריט <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><line x1="12" y1="7.5" x2="12" y2="16"/><line x1="7" y1="11" x2="17" y2="11"/><line x1="12" y1="16" x2="8.5" y2="21"/><line x1="12" y1="16" x2="15.5" y2="21"/></svg>ישות">
    <div id="a11y-panel-title">כלי <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="2.5"/><line x1="12" y1="7.5" x2="12" y2="16"/><line x1="7" y1="11" x2="17" y2="11"/><line x1="12" y1="16" x2="8.5" y2="21"/><line x1="12" y1="16" x2="15.5" y2="21"/></svg>ישות</div>
    <button class="a11y-btn" onclick="a11yFont(1)">הגדל טקסט  א+</button>
    <button class="a11y-btn" onclick="a11yFont(-1)">הקטן טקסט  א-</button>
    <button class="a11y-btn" id="ab-contrast" onclick="a11yClass('a11y-contrast','ab-contrast')">ניגודיות גבוהה</button>
    <button class="a11y-btn" id="ab-gray"     onclick="a11yClass('a11y-gray','ab-gray')">גווני אפור</button>
    <button class="a11y-btn" id="ab-links"    onclick="a11yClass('a11y-links','ab-links')">הדגשת קישורים</button>
    <button class="a11y-btn" id="ab-font"     onclick="a11yClass('a11y-font','ab-font')">פונט קריא</button>
    <button class="a11y-btn" onclick="a11yReset()">↺ איפוס</button>
  </div>
</div>
<script>
(function(){
  var S=JSON.parse(localStorage.getItem('a11y')||'{}');
  if(S.fs)document.documentElement.style.fontSize=S.fs+'px';
  ['a11y-contrast','a11y-gray','a11y-links','a11y-font'].forEach(function(c){if(S[c])document.body.classList.add(c);});
  function sync(){
    [['a11y-contrast','ab-contrast'],['a11y-gray','ab-gray'],['a11y-links','ab-links'],['a11y-font','ab-font']].forEach(function(p){
      var b=document.getElementById(p[1]);if(b)b.classList.toggle('a11y-active',document.body.classList.contains(p[0]));
    });
  }
  window.toggleA11y=function(){
    var p=document.getElementById('a11y-panel');
    p.classList.toggle('open');
    document.getElementById('a11y-toggle').setAttribute('aria-expanded',p.classList.contains('open'));
    sync();
  };
  window.a11yFont=function(d){
    var S=JSON.parse(localStorage.getItem('a11y')||'{}');
    var c=S.fs||16;var n=Math.min(26,Math.max(12,c+d*2));
    document.documentElement.style.fontSize=n+'px';S.fs=n;
    localStorage.setItem('a11y',JSON.stringify(S));
  };
  window.a11yClass=function(cls,btnId){
    document.body.classList.toggle(cls);
    var S=JSON.parse(localStorage.getItem('a11y')||'{}');S[cls]=document.body.classList.contains(cls);
    localStorage.setItem('a11y',JSON.stringify(S));sync();
  };
  window.a11yReset=function(){
    ['a11y-contrast','a11y-gray','a11y-links','a11y-font'].forEach(function(c){document.body.classList.remove(c);});
    document.documentElement.style.fontSize='';localStorage.removeItem('a11y');sync();
  };
  sync();
})();
</script>

</body>
</html>
